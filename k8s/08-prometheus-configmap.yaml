# =============================================================================
# Prometheus ConfigMap — static scrape config (no Operator)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: aiops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Hard caps for local dev
    storage:
      tsdb:
        retention.time: 24h
        retention.size: 1GB

    scrape_configs:
      # OTel Collector metrics (includes service_name label via resource_to_telemetry_conversion)
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector:8889']

      # Gateway, Orders, Inventory metrics via OTel Collector (same endpoint, different service_name)
      # The OTel Collector exposes all three services' metrics on its /metrics endpoint
      # with service_name label, so one scrape job covers all.

      # Jaeger metrics
      - job_name: 'jaeger'
        static_configs:
          - targets: ['jaeger:16686']

      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Node metrics (if node-exporter were deployed)
      # - job_name: 'node'
      #   static_configs:
      #     - targets: ['node-exporter:9100']

    # Allow remote reload via HTTP POST /-/reload
    # (enabled by --web.enable-lifecycle flag in container args)