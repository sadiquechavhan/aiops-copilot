# =============================================================================
# PostgreSQL — StatefulSet with persistent volume
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aiops
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  clusterIP: None  # Headless for StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aiops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: "aiops"
            - name: POSTGRES_USER
              value: "aiops"
            - name: POSTGRES_PASSWORD
              value: "aiops"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          command:
            - postgres
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=30
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              memory: "256Mi"
            requests:
              memory: "128Mi"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: pgdata
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard