# =============================================================================
# OTel Collector — Deployment
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: aiops
spec:
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 8889
      targetPort: 8889
      name: prometheus
    - port: 13133
      targetPort: 13133
      name: health
  selector:
    app: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          command:
            - --config=/etc/otelcol/config.yaml
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: prometheus
            - containerPort: 13133
              name: health
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            limits:
              memory: "192Mi"
            requests:
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: otel-collector-config